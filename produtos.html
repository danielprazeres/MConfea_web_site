  <!-- Favicons -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&display=swap"
    rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/main.css" rel="stylesheet">
  <link href="assets/css/pagination.css" rel="stylesheet">

  <style>
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;

    .card-img-top {

    .card-body {

    .card.h-100 {

<body>

  <!-- ======= Header ======= -->
  <header id="header" class="header d-flex align-items-center">
    <div class="container-fluid container-xl d-flex align-items-center justify-content-between">
      <a href="index.html" class="logo d-flex align-items-center">
        <img src="assets/img/logo.png" alt="M Conf&A">
      </a>
      <i class="mobile-nav-toggle mobile-nav-show bi bi-list"></i>
      <i class="mobile-nav-toggle mobile-nav-hide d-none bi bi-x"></i>
      <nav id="navbar" class="navbar">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="produtos.html" class="active">Produtos</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ======= Breadcrumbs ======= -->
  <div class="breadcrumbs d-flex align-items-center" style="background-image: url('assets/img/breadcrumbs-bg.jpg');">
    <div class="container position-relative d-flex flex-column align-items-center" data-aos="fade">
      <h2>Produtos</h2>
      <ol>
        <li><a href="index.html">Home</a></li>
        <li>Produtos</li>
      </ol>
    </div>
  </div>

  <!-- ======= Products Section ======= -->
  <section id="products" class="products">
    <div class="container" data-aos="fade-up">

      <div class="section-header">
        <h2>Nossos Produtos</h2>
        <p>Explore nossas soluções de climatização, automação e energia sustentável.</p>
      </div>

      <!-- Barra de pesquisa -->
      <div class="row mb-4">
        <div class="col-lg-9 d-flex">
          <input type="text" id="search-bar" class="form-control me-2" placeholder="Pesquisar produtos por nome, categoria ou descrição..." onkeypress="handleKeyPress(event)">
          <button class="btn btn-primary" onclick="searchProducts()">
            <i class="bi bi-search"></i> Buscar
          </button>
        </div>
        <div class="col-lg-3 d-flex">
          <button class="btn btn-secondary ms-2" onclick="clearSearch()">Limpar Pesquisa</button>
        </div>
      </div>

      <!-- Filtros -->
      <div class="row mb-4">
        <div class="col-lg-3">
          <select id="filter-empresa" class="form-select" onchange="applyFilters()">
            <option value="">Filtrar por Empresa</option>
          </select>
        </div>
        <div class="col-lg-3">
          <select id="filter-categoria" class="form-select" onchange="applyFilters()">
            <option value="">Filtrar por Categoria</option>
          </select>
        </div>
        <div class="col-lg-3">
          <select id="filter-subcategoria" class="form-select" onchange="applyFilters()">
            <option value="">Filtrar por Subcategoria</option>
          </select>
        </div>
        <div class="col-lg-3 d-flex">
          <button class="btn btn-secondary ms-2" onclick="clearFilters()">Limpar Filtros</button>
        </div>
      </div>

      <div class="row gy-4" id="product-list"></div>

      <!-- Paginação -->
      <div class="row">
        <div class="col-12 text-center mt-4">
          <nav class="d-inline-block">
            <ul class="pagination" id="pagination"></ul>
          </nav>
        </div>
      </div>

    </div>
  </section>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <script>
    let allProducts = [];
    let filteredProducts = [];
    let currentPage = 1;
    const itemsPerPage = 9;

    async function loadProducts() {
      try {
        const response = await fetch("assets/data/produtos.json");
        allProducts = await response.json();
        filteredProducts = [...allProducts];
        populateFilters();
        renderProducts();
        renderPagination();
      } catch (error) {
        console.error("Erro ao carregar produtos:", error);
      }
    }

    function populateFilters() {
      const empresaSet = new Set();
      const categoriaSet = new Set();
      const subcategoriaSet = new Set();

      allProducts.forEach(produto => {
        empresaSet.add(produto.empresa);
        categoriaSet.add(produto.categoria);
        subcategoriaSet.add(produto.subcategoria);
      });

      populateSelect("filter-empresa", Array.from(empresaSet));
      populateSelect("filter-categoria", Array.from(categoriaSet));
      populateSelect("filter-subcategoria", Array.from(subcategoriaSet));
    }

    function populateSelect(selectId, options) {
      const select = document.getElementById(selectId);
      select.innerHTML = `<option value="">Filtrar por ${select.getAttribute('id').split('-')[1]}</option>`;
      options.forEach(option => {
        select.innerHTML += `<option value="${option}">${option}</option>`;
      });
    }

    function applyFilters() {
      const searchQuery = document.getElementById("search-bar").value.toLowerCase().trim();
      const empresa = document.getElementById("filter-empresa").value;
      const categoria = document.getElementById("filter-categoria").value;
      const subcategoria = document.getElementById("filter-subcategoria").value;

      filteredProducts = allProducts.filter(produto =>
        (empresa === "" || produto.empresa === empresa) &&
        (categoria === "" || produto.categoria === categoria) &&
        (subcategoria === "" || produto.subcategoria === subcategoria) &&
        (searchQuery === "" || produto.nome.toLowerCase().includes(searchQuery))
      );

      currentPage = 1;
      renderProducts();
      renderPagination();
    }

    function clearFilters() {
      document.getElementById("filter-empresa").value = "";
      document.getElementById("filter-categoria").value = "";
      document.getElementById("filter-subcategoria").value = "";
      document.getElementById("search-bar").value = "";
      applyFilters();
    }

    document.addEventListener("DOMContentLoaded", loadProducts);
  </script>

</body>

</html>
