  <!-- Script para carregar produtos dinamicamente -->
  <script>
    const itemsPerPage = 9; // Produtos por página
    let currentPage = 1;
    let allProducts = [];
    let originalProducts = [];
    let filteredProducts = []; // Nova variável para armazenar produtos filtrados
    let isSearching = false; // Indica se estamos realizando uma busca
    let isFiltering = false; // Indica se estamos aplicando filtros
    
    // Armazena os filtros ativos
    let activeFilters = {
      empresa: '',
      categoria: '',
      subcategoria: ''
    };
    
    // Arrays para armazenar opções únicas para os filtros
    let empresas = [];
    let categorias = [];
    let subcategorias = [];

    // Carrega os produtos
    function loadProducts() {
      fetch("assets/data/produtos.json")
        .then(response => response.json())
        .then(produtos => {
          allProducts = produtos;
          originalProducts = [...produtos];
          filteredProducts = [...produtos]; // Inicialmente, a lista filtrada é igual à original
          
          // Extrai valores únicos para os filtros
          extractFilterOptions();
          
          // Popula os dropdowns de filtros
          populateFilterDropdowns();
          
          renderProducts();
          renderPagination();
        })
        .catch(error => console.error("Erro ao carregar produtos:", error));
    }

    // Extrai opções únicas para os filtros
    function extractFilterOptions() {
      // Conjunto para garantir valores únicos
      const empresasSet = new Set();
      const categoriasSet = new Set();
      const subcategoriasSet = new Set();
      
      allProducts.forEach(produto => {
        if (produto.empresa) empresasSet.add(produto.empresa);
        if (produto.categoria) categoriasSet.add(produto.categoria);
        if (produto.subcategoria) subcategoriasSet.add(produto.subcategoria);
      });
      
      // Converte os conjuntos para arrays ordenados
      empresas = Array.from(empresasSet).sort();
      categorias = Array.from(categoriasSet).sort();
      subcategorias = Array.from(subcategoriasSet).sort();
    }
    
    // Preenche os dropdowns de filtros com as opções disponíveis
    function populateFilterDropdowns() {
      const empresaSelect = document.getElementById('empresa-filter');
      const categoriaSelect = document.getElementById('categoria-filter');
      const subcategoriaSelect = document.getElementById('subcategoria-filter');
      
      // Limpa as opções existentes (mantendo a primeira opção)
      while (empresaSelect.options.length > 1) {
        empresaSelect.remove(1);
      }
      
      while (categoriaSelect.options.length > 1) {
        categoriaSelect.remove(1);
      }
      
      while (subcategoriaSelect.options.length > 1) {
        subcategoriaSelect.remove(1);
      }
      
      // Adiciona as opções de empresas
      empresas.forEach(empresa => {
        const option = document.createElement('option');
        option.value = empresa;
        option.textContent = empresa;
        empresaSelect.appendChild(option);
      });
      
      // Adiciona as opções de categorias
      categorias.forEach(categoria => {
        const option = document.createElement('option');
        option.value = categoria;
        option.textContent = categoria;
        categoriaSelect.appendChild(option);
      });
      
      // Adiciona as opções de subcategorias
      subcategorias.forEach(subcategoria => {
        const option = document.createElement('option');
        option.value = subcategoria;
        option.textContent = subcategoria;
        subcategoriaSelect.appendChild(option);
      });
    }
    
    // Atualiza a lista de subcategorias com base na categoria selecionada
    function updateSubcategoriesBasedOnCategory() {
      const categoriaSelect = document.getElementById('categoria-filter');
      const subcategoriaSelect = document.getElementById('subcategoria-filter');
      const selectedCategory = categoriaSelect.value;
      
      // Limpa as opções existentes (mantendo a primeira opção)
      while (subcategoriaSelect.options.length > 1) {
        subcategoriaSelect.remove(1);
      }
      
      if (selectedCategory === '') {
        // Se nenhuma categoria for selecionada, mostra todas as subcategorias
        subcategorias.forEach(subcategoria => {
          const option = document.createElement('option');
          option.value = subcategoria;
          option.textContent = subcategoria;
          subcategoriaSelect.appendChild(option);
        });
      } else {
        // Se uma categoria for selecionada, mostra apenas as subcategorias relacionadas
        const relatedSubcategories = new Set();
        
        allProducts.forEach(produto => {
          if (produto.categoria === selectedCategory && produto.subcategoria) {
            relatedSubcategories.add(produto.subcategoria);
          }
        });
        
        Array.from(relatedSubcategories).sort().forEach(subcategoria => {
          const option = document.createElement('option');
          option.value = subcategoria;
          option.textContent = subcategoria;
          subcategoriaSelect.appendChild(option);
        });
      }
    }
    
    // Aplica os filtros selecionados
    function applyFilters() {
      const empresaSelect = document.getElementById('empresa-filter');
      const categoriaSelect = document.getElementById('categoria-filter');
      const subcategoriaSelect = document.getElementById('subcategoria-filter');
      
      // Atualiza os filtros ativos
      activeFilters.empresa = empresaSelect.value;
      activeFilters.categoria = categoriaSelect.value;
      activeFilters.subcategoria = subcategoriaSelect.value;
      
      isFiltering = activeFilters.empresa !== '' || 
                   activeFilters.categoria !== '' || 
                   activeFilters.subcategoria !== '';
      
      // Filtra os produtos
      if (isFiltering) {
        filteredProducts = originalProducts.filter(produto => {
          // Verifica cada filtro
          const matchEmpresa = activeFilters.empresa === '' || produto.empresa === activeFilters.empresa;
          const matchCategoria = activeFilters.categoria === '' || produto.categoria === activeFilters.categoria;
          const matchSubcategoria = activeFilters.subcategoria === '' || produto.subcategoria === activeFilters.subcategoria;
          
          // Produto deve corresponder a todos os filtros ativos
          return matchEmpresa && matchCategoria && matchSubcategoria;
        });
      } else {
        // Se não houver filtros, restaura a lista original
        filteredProducts = [...originalProducts];
      }
      
      // Se também houver uma pesquisa ativa, aplica o filtro de pesquisa novamente
      if (isSearching) {
        const query = document.getElementById('search-bar').value.toLowerCase().trim();
        filteredProducts = filteredProducts.filter(produto =>
          produto.nome.toLowerCase().includes(query) ||
          produto.descricao.toLowerCase().includes(query) ||
          produto.categoria.toLowerCase().includes(query) ||
          produto.subcategoria.toLowerCase().includes(query)
        );
      }
      
      // Atualiza a exibição de filtros ativos
      updateActiveFiltersDisplay();
      
      // Atualiza o contador de filtros
      updateFilterCount();
      
      // Reseta para a primeira página
      currentPage = 1;
      renderProducts();
      renderPagination();
    }
    
    // Atualiza o contador de filtros ativos
    function updateFilterCount() {
      const filterCountBadge = document.getElementById('filter-count');
      let count = 0;
      
      if (activeFilters.empresa !== '') count++;
      if (activeFilters.categoria !== '') count++;
      if (activeFilters.subcategoria !== '') count++;
      
      if (count > 0) {
        filterCountBadge.textContent = count;
        filterCountBadge.classList.remove('d-none');
      } else {
        filterCountBadge.classList.add('d-none');
      }
    }
    
    // Atualiza a exibição de filtros ativos
    function updateActiveFiltersDisplay() {
      const activeFiltersContainer = document.getElementById('active-filters');
      activeFiltersContainer.innerHTML = '';
      
      // Se não houver filtros ativos, não exibe nada
      if (!isFiltering) return;
      
      // Exibe os filtros ativos como tags removíveis
      if (activeFilters.empresa !== '') {
        const tag = createFilterTag('Empresa: ' + activeFilters.empresa, 'empresa');
        activeFiltersContainer.appendChild(tag);
      }
      
      if (activeFilters.categoria !== '') {
        const tag = createFilterTag('Categoria: ' + activeFilters.categoria, 'categoria');
        activeFiltersContainer.appendChild(tag);
      }
      
      if (activeFilters.subcategoria !== '') {
        const tag = createFilterTag('Subcategoria: ' + activeFilters.subcategoria, 'subcategoria');
        activeFiltersContainer.appendChild(tag);
      }
    }
    
    // Cria uma tag de filtro removível
    function createFilterTag(text, filterType) {
      const tag = document.createElement('span');
      tag.className = 'badge bg-secondary me-2 mb-2 p-2';
      tag.innerHTML = `${text} <i class="bi bi-x-circle" style="cursor: pointer;"></i>`;
      
      // Adiciona evento para remover o filtro
      tag.querySelector('i').addEventListener('click', function() {
        // Reseta o filtro específico
        activeFilters[filterType] = '';
        
        // Reseta o select correspondente
        document.getElementById(`${filterType}-filter`).value = '';
        
        // Se for o filtro de categoria, atualiza as subcategorias
        if (filterType === 'categoria') {
          updateSubcategoriesBasedOnCategory();
        }
        
        // Reaplica os filtros
        applyFilters();
      });
      
      return tag;
    }
    
    // Limpa todos os filtros
    function clearFilters() {
      // Reseta os selects
      document.getElementById('empresa-filter').value = '';
      document.getElementById('categoria-filter').value = '';
      document.getElementById('subcategoria-filter').value = '';
      
      // Reseta os filtros ativos
      activeFilters.empresa = '';
      activeFilters.categoria = '';
      activeFilters.subcategoria = '';
      
      isFiltering = false;
      
      // Atualiza subcategorias
      updateSubcategoriesBasedOnCategory();
      
      // Limpa a exibição de filtros ativos
      document.getElementById('active-filters').innerHTML = '';
      
      // Atualiza o contador de filtros
      updateFilterCount();
      
      // Se ainda houver pesquisa ativa, mantenha apenas os resultados da pesquisa
      if (isSearching) {
        searchProducts();
      } else {
        // Restaura a lista original
        filteredProducts = [...originalProducts];
        currentPage = 1;
        renderProducts();
        renderPagination();
      }
    }

    // Renderiza os produtos com base na página atual
    function renderProducts() {
      const productList = document.getElementById('product-list');
      productList.innerHTML = '';

      // Define a lista de produtos com base na filtragem ou pesquisa
      const productsToDisplay = isFiltering || isSearching ? filteredProducts : originalProducts;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const productsToShow = productsToDisplay.slice(startIndex, endIndex);

      // Se não houver produtos para exibir, mostra uma mensagem
      if (productsToShow.length === 0) {
        productList.innerHTML = `
          <div class="col-12 text-center py-5">
            <h3>Nenhum produto encontrado</h3>
            <p>Tente modificar sua pesquisa ou filtros.</p>
            <button class="btn btn-secondary mt-3" onclick="clearAll()">Limpar Todos os Filtros</button>
          </div>
        `;
        return;
      }

      productsToShow.forEach(produto => {
        const productItem = document.createElement('div');
        productItem.className = 'col-lg-4 col-md-6';
        productItem.innerHTML = `
          <div class="card h-100">
            <img src="${produto.pasta}${produto.imagens[0]}" class="card-img-top" alt="${produto.nome}">
            <div class="card-body">
              <h5 class="card-title">${produto.nome}</h5>
              <p class="card-text">${produto.descricao}</p>
              <p class="text-muted"><small>${produto.categoria} > ${produto.subcategoria}</small></p>
              <p class="text-muted"><strong>Fabricante:</strong> ${produto.empresa}</p>
              <a href="produto-detalhes.html?id=${produto.id}" class="btn btn-primary">Saber Mais</a>
            </div>
          </div>
        `;
        productList.appendChild(productItem);
      });
    }

    // Renderiza os links de paginação
    function renderPagination() {
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      // Define a lista correta para paginação
      const productsToPaginate = isFiltering || isSearching ? filteredProducts : originalProducts;
      const totalPages = Math.ceil(productsToPaginate.length / itemsPerPage);

      // Se não houver páginas, não exibe paginação
      if (totalPages === 0) return;

      for (let i = 1; i <= totalPages; i++) {
        const pageItem = document.createElement('li');
        pageItem.className = 'page-item ' + (i === currentPage ? 'active' : '');
        pageItem.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>`;
        pagination.appendChild(pageItem);
      }
    }

    // Função para mudar de página
    function goToPage(pageNumber) {
      currentPage = pageNumber;
      renderProducts();
      renderPagination();
    }

    // Função de busca acionada pelo botão ou Enter
    function searchProducts() {
      const query = document.getElementById('search-bar').value.toLowerCase().trim();
      
      if (query === '') {
        clearSearch(); // Se a pesquisa estiver vazia, volta para a exibição normal
        return;
      }

      isSearching = true; // Indica que a pesquisa está ativa

      // Se também houver filtros ativos, começa com a lista já filtrada
      const baseProductList = isFiltering ? filteredProducts : originalProducts;

      // Filtra os produtos com base na pesquisa
      filteredProducts = baseProductList.filter(produto =>
        produto.nome.toLowerCase().includes(query) ||
        produto.descricao.toLowerCase().includes(query) ||
        produto.categoria.toLowerCase().includes(query) ||
        produto.subcategoria.toLowerCase().includes(query)
      );

      currentPage = 1; // Sempre volta para a primeira página ao buscar
      renderProducts();
      renderPagination();
    }

    // Limpa a pesquisa e restaura os produtos
    function clearSearch() {
      document.getElementById('search-bar').value = '';
      isSearching = false; // Indica que a pesquisa não está mais ativa
      
      // Se houver filtros ativos, mantém apenas os filtros aplicados
      if (isFiltering) {
        applyFilters(); // Reaplica os filtros para restaurar a lista filtrada
      } else {
        filteredProducts = [...originalProducts]; // Restaura a lista original
        currentPage = 1;
        renderProducts();
        renderPagination();
      }
    }

    // Limpa todos os filtros e pesquisa
    function clearAll() {
      document.getElementById('search-bar').value = '';
      isSearching = false;
      
      // Limpa filtros
      clearFilters();
      
      // Restaura a lista original
      filteredProducts = [...originalProducts];
      currentPage = 1;
      renderProducts();
      renderPagination();
    }

    // Dispara a pesquisa ao pressionar Enter
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        searchProducts();
      }
    }

    // Adiciona listeners de eventos para os filtros de categoria
    document.addEventListener("DOMContentLoaded", function() {
      loadProducts();
      
      // Adiciona event listener para atualizar subcategorias quando a categoria mudar
      document.getElementById('categoria-filter').addEventListener('change', updateSubcategoriesBasedOnCategory);
    });
